name: Catalogue

# The saturation fit costs minutes per fluid and the fluids are independent, so
# the catalogue is generated once, here, and committed. Regenerating locally is
# never required: `make_fluid <Name>` is for checking one, or changing one.
on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners to split the catalogue over"
        default: "16"
      commit:
        description: "Commit the result into data/ on this branch (otherwise artifact only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra coolprop
      - id: plan
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          uv run python -m propax.make_fluid --list-convertible > fluids.txt
          echo "$(wc -l < fluids.txt) convertible fluids"
          seq 0 $((SHARDS - 1)) | jq -Rrs '"shards=\( split("\n")[:-1] | map(tonumber) )"' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fluid-list
          path: fluids.txt

  generate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra coolprop
      - uses: actions/download-artifact@v4
        with:
          name: fluid-list
      - name: Generate this shard # for one shard of the list run ...
      # create out directory for collecting
      # each shard creates a sublist of fluids and creates out/*fluid*.json
        run: |
          mkdir -p out 
          total=${{ strategy.job-total }}
          awk "NR % $total == ${{ matrix.shard }}" fluids.txt > shard.txt
          echo "this shard: $(wc -l < shard.txt) fluids"
          cat shard.txt
          xargs -P 2 -n 1 -a shard.txt \
            uv run python -m propax.make_fluid --out out --force || true
          ls -1 out | wc -l
      
      # out becomes an artifact containing all fluids generated by the shard
      - uses: actions/upload-artifact@v4
        with:
          name: fluids-${{ matrix.shard }}
          path: out/*.json
          if-no-files-found: warn

  collect:
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: fluids-*
          path: collected
          merge-multiple: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra test --extra coolprop

      - name: What came back 
      # all generated fluids are stored within the data 
      # folder in propax, we count the number of fluids and keep
      # track of fluids whose generation has failed
        run: |
          cp collected/*.json src/propax/fluids/data/
          ls -1 src/propax/fluids/data/*.json | wc -l
          uv run python -m propax.make_fluid --list-convertible > wanted.txt
          uv run python - <<'PY'
          import json, pathlib
          have = {p.stem for p in pathlib.Path("src/propax/fluids/data").glob("*.json")}
          want = {n.lower().replace(" ", "") for n in
                  pathlib.Path("wanted.txt").read_text().split()}
          missing = sorted(want - have)
          print(f"{len(have)} generated, {len(missing)} missing")
          for m in missing:
              print("  missing:", m)
          PY

      # every generated file must parse and register, or the catalogue is not
      # shippable whatever the fit reported
      - name: The catalogue loads
        run: uv run python -m pytest tests/test_fluid_files.py -q

      - name: Commit into data/
        if: ${{ inputs.commit }}
        # commits in data on the current branch and replay the commit over
        # those made during the run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/propax/fluids/data/*.json
          if git diff --cached --quiet; then
            echo "the catalogue on ${GITHUB_REF_NAME} is already what this run produced"
            exit 0
          fi
          git commit -m "catalogue: $(ls -1 src/propax/fluids/data/*.json | wc -l) fluids

          Generated by .github/workflows/catalogue.yml, run ${GITHUB_RUN_ID}."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "pushed to ${GITHUB_REF_NAME}"
      
      # ensure fluids properties can still be downloaded manually (zip file)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalogue
          path: src/propax/fluids/data/*.json
