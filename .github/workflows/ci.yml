name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python 3.13 --extra test --extra coolprop

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format
        run: uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync pyright

  tests:
    name: py${{ matrix.python-version }} · x64=${{ matrix.x64 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # test in both 32bits and 64bits precison
          - { python-version: "3.13", x64: "1" }
          - { python-version: "3.13", x64: "0" }

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: >
          uv sync --python ${{ matrix.python-version }}
          --extra test --extra coolprop

      - name: Show the resolved python stack
        run: uv pip list | grep -iE '^(jax|jaxlib|lineax|equinox|optimistix) '

      - name: Tests
        env:
          PROPAX_TEST_X64: ${{ matrix.x64 }}
        run: uv run --no-sync pytest -q
