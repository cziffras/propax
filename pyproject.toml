[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0"]

[dependency-groups]
dev = [
  "ipykernel>=7.1.0",
  "ipython>=9.7.0",
  "jupyter>=1.1.1",
  "prek>=0.2",
  "pyright==1.1.411",
  "pytest>=8.4.2",
  "ruff==0.15.20",
  "toml-sort>=0.24"
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.27"
]

[project]
authors = [{name = "Emmanuel Benichou"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
  "equinox>=0.13.2",
  "jax>=0.8.1", 
  "jaxtyping>=0.2.36",
  "lineax>=0.0.7",
  "numpy>=2.0",
  "optimistix>=0.0.11",
  "pydantic>=2.12.4"
]
description = "Differentiable CoolProp-style fluid properties in pure JAX, driven by fluid definition files."
keywords = ["thermodynamics", "equation-of-state", "jax", "fluid-properties", "coolprop"]
license = "MIT"
license-files = ["LICENSE"]
name = "propax"
readme = "README.md"
requires-python = ">=3.12"
urls = {repository = "https://github.com/cziffras/propax"}
version = "0.1.1"

[project.optional-dependencies]
build = [
  "scipy>=1.11"
]
coolprop = [
  "coolprop>=6.6.0",
  "mpmath>=1.3"
]
notebooks = [
  "matplotlib>=3.10",
  "plotly>=6.5",
  "ipykernel>=7.1"
]
test = [
  "pytest",
  "coolprop>=6.6.0"
]

[tool.pyright]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
ignore = [
  "E501",
  "F722"
]
select = ["E", "F", "I"]
unfixable = ["F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.setuptools.package-data]
"propax" = ["py.typed"]
"propax.fluids" = ["data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
